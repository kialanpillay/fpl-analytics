[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-analytics"
version = "2.0.0"
description = "Season-long Fantasy Premier League modelling, value analysis and squad optimisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "PyYAML>=6.0",
  "pulp>=2.8.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
fpl = "fpl_analytics.cli:main"
fpl-web = "fpl_analytics.server.app:main"

[tool.setuptools.packages.find]
include = ["fpl_analytics*"]
