[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-analytics"
version = "2.0.0"
description = "Season-long Fantasy Premier League modelling, value analysis and squad optimisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "PyYAML>=6.0",
  "pulp>=2.8.0",
]

[project.scripts]
fpl = "fpl_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["fpl_analytics*"]
